# GOPOD Core Pod Specification
# Run with native Podman:
#   podman play kube deploy/gopod-core.pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: gopod-system
  labels:
    app.kubernetes.io/name: gopod
    app.kubernetes.io/part-of: gopod-paas
spec:
  containers:
    # ── Ingress Reverse Proxy (Caddy) ──
    - name: caddy
      image: docker.io/library/caddy:alpine
      ports:
        - name: http
          containerPort: 80
          hostPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          hostPort: 443
          protocol: TCP
      volumeMounts:
        - name: caddy-config
          mountPath: /etc/caddy
        - name: caddy-data
          mountPath: /data
        - name: caddy-logs
          mountPath: /var/log/caddy

    # ── GOPOD Control Plane (Go Single Binary + Embedded Svelte SPA + SQLite) ──
    - name: gopod-server
      image: ghcr.io/ijon6k/gopod:dev
      env:
        - name: PORT
          value: "8085"
        - name: PODMAN_SOCKET
          value: "/run/podman/podman.sock"
        - name: GOPOD_DB_PATH
          value: "/app/data/gopod.db"
        - name: CADDY_ADMIN_URL
          value: "http://127.0.0.1:2019"
      volumeMounts:
        - name: gopod-data
          mountPath: /app/data
        - name: podman-sock
          mountPath: /run/podman/podman.sock

  volumes:
    - name: gopod-data
      hostPath:
        path: ~/.local/share/gopod/data
        type: DirectoryOrCreate
    - name: caddy-config
      hostPath:
        path: ~/.config/gopod/caddy
        type: DirectoryOrCreate
    - name: caddy-data
      hostPath:
        path: ~/.local/share/gopod/caddy/data
        type: DirectoryOrCreate
    - name: caddy-logs
      hostPath:
        path: ~/.local/share/gopod/logs
        type: DirectoryOrCreate
    - name: podman-sock
      hostPath:
        path: /run/user/1000/podman/podman.sock
        type: Socket
