# Config file for Air (Go hot-reload tool)
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
bin = "./tmp/server"
full_bin = "PORT=8000 GOPOD_DB_PATH=../data/gopod.db ./tmp/server"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor", "testdata", "dist"]
include_dir = ["cmd", "internal", "pkg"]
exclude_file = []
exclude_regex = ["_test.go"]
delay = 500
stop_on_error = true
log = "build-errors.log"

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
