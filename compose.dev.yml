services:
  gopod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gopod-dev
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:8085"
    environment:
      - PORT=8085
      - PODMAN_SOCKET=/run/podman/podman.sock
      - CONTAINER_HOST=unix:///run/podman/podman.sock
      - DOCKER_HOST=unix:///run/podman/podman.sock
      - GOPOD_DB_PATH=/app/data/gopod.db
      # Unix-socket admin transport (dev and prod share the same semantics);
      # Gopod and Caddy both consume gopod-caddy-admin.
      - CADDY_ADMIN_URL=unix:///run/gopod-caddy/admin.sock
      - HOST_DATA_DIR=${HOST_DATA_DIR:-${PWD}/data}
      # Vite dev server (bun run dev on the host) proxies /api here; the browser
      # sends Origin http://localhost:5173, so that origin is explicitly
      # allow-listed. Credentialed CORS is limited to allow-listed origins.
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:5173}
      # Host systemd user-manager bus: lets the containerized engine run
      # `systemctl --user` equivalents (daemon-reload/start/stop) via D-Bus.
      - GOPOD_USER_BUS=/run/host-run/bus
    volumes:
      - "${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock:z"
      - "./data:/app/data:Z"
      - "./caddy/logs:/var/log/caddy:z"
      - "${HOME}/.config/containers/systemd:/root/.config/containers/systemd:z"
      - "${XDG_RUNTIME_DIR:-/run/user/1000}/bus:/run/host-run/bus"
      - "gopod-caddy-admin-dev:/run/gopod-caddy:z"
    networks:
      - gopod-internal
    security_opt:
      - label=disable

  caddy:
    image: docker.io/library/caddy:alpine
    container_name: gopod-caddy-dev
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      - CADDY_INGRESS_NETWORK=gopod-net
    volumes:
      - "./caddy/Caddyfile:/etc/caddy/Caddyfile:Z"
      - "./caddy/data:/data:Z"
      - "./caddy/config:/config:Z"
      - "./caddy/logs:/var/log/caddy:z"
      - "gopod-caddy-admin-dev:/run/gopod-caddy:z"
    networks:
      - gopod-internal
      - gopod-net

networks:
  gopod-internal:
    name: gopod-internal-dev
    driver: bridge
  gopod-net:
    name: gopod-net-dev
    driver: bridge

volumes:
  gopod-caddy-admin-dev:
