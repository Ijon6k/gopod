name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — build · vet · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go (matches backend/go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...
        working-directory: backend

      - name: Vet
        run: go vet ./...
        working-directory: backend

      # Plain race run on purpose: with go1.26.0, ANY -cover flag makes the go
      # command reach for the covdata binary when handling packages without
      # test files, and that binary is no longer shipped in the distribution.
      # The raw log is tee'd to /tmp; on failure the failing lines are
      # re-emitted as ::error:: annotations (they render on the public job
      # page) plus a digest into the run summary, so the failure context is
      # legible without digging through archived logs.
      - name: Test (race enabled; podman E2E suite is env opt-in and skipped here)
        id: gotest
        continue-on-error: true
        working-directory: backend
        run: set -o pipefail; go test -race ./... 2>&1 | tee /tmp/gotest.log

      - name: Surface test failures (annotations + summary digest)
        if: steps.gotest.outcome != 'success'
        working-directory: backend
        run: |
          set +e
          {
            echo "## go test failure context"
            echo
            echo '```'
            grep -nE '^--- FAIL|^FAIL|^panic|WARNING: DATA RACE|^go:|^#' /tmp/gotest.log | cut -c1-220 | head -40
            echo
            echo '- last 180 lines of raw output -'
            echo
            tail -180 /tmp/gotest.log | head -c 60000
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^--- FAIL|^FAIL|^panic|WARNING: DATA RACE|^go:' /tmp/gotest.log | cut -c1-180 | head -30 | while IFS= read -r line; do
            [ -z "$line" ] && continue
            printf '::error::%s\n' "$line"
          done
          exit 1

  frontend:
    name: Frontend — check · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Svelte check (type + template diagnostics)
        run: bun run check
        working-directory: frontend

      - name: Production build
        run: bun run build
        working-directory: frontend

  # Informational for now: the repo carries pre-existing formatting drift
  # (gofmt in backend/internal/podman/types.go, prettier in ~42 frontend
  # files). Once those are swept, remove continue-on-error to make this
  # job a hard gate.
  lint:
    name: Lint (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go (toolchain for gofmt; eslint ts resolution)
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l backend)
          if [ -n "$unformatted" ]; then
            echo "gofmt drift in: $unformatted"
            exit 1
          fi

      - name: Prettier + eslint check
        run: bun run lint
        working-directory: frontend
